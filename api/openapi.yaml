        matchBasis:
          type: string
          enum: [business_number, name_address_phone, name_address]
        status:
          type: string
          enum: [pending_review, merged, kept_separate]

    HistoryEntry:
      type: object
      description: "[미구현]"
      properties:
        shopId: { type: integer, format: int64 }
        changedAt: { type: string, format: date-time }
        field: { type: string, example: 영업 상태 }
        beforeValue: { type: string, nullable: true }
        afterValue: { type: string, nullable: true }
        cause: { type: string, example: 인허가 갱신 }

    # ------------------------------- AI CRM (미구현 · 엔터티만 존재 · R-RABMND)
    VisitStatus:
      type: string
      enum: [NOT_VISITED, FIRST_VISIT, SECOND_VISIT, THIRD_VISIT, FOURTH_VISIT, FIFTH_VISIT]
      description: >
        `domain/salesactivity/entity/VisitStatus.java`.
        **방문 "차수"** 를 나타냅니다 — 미방문, 1차~5차 방문.


        ⚠️ 기획서(`R-RABMND`)가 요구하는 **접촉 "결과"**(관심 있음 / 거절 / 보류 / 부재)와는
        다른 축입니다. AI 후속 제안은 "실패 또는 보류 결과가 기록되면 시작"하는데,
        이 enum 으로는 그 조건을 표현할 수 없습니다 — 백엔드 협의 필요.

    User:
      type: object
      description: >
        `domain/user/entity/User.java`. 엔터티만 있고 컨트롤러·서비스는 없습니다.


        ⚠️ **비밀번호 컬럼이 없습니다.** 로그인·회원가입을 붙이려면 인증 필드부터 추가해야 합니다.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 50 }
        email: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 30, nullable: true }
        assignedRegionId:
          type: integer
          format: int64
          nullable: true
          description: 담당 구역. Region 엔터티가 없어 현재는 단순 Long 값입니다.

    SalesActivity:
      type: object
      description: >
        `domain/salesactivity/entity/SalesActivity.java`. **엔터티와 리포지토리만 있고
        컨트롤러·서비스가 없어 호출 가능한 엔드포인트는 아직 없습니다.**
      properties:
        id: { type: integer, format: int64 }
        shopId: { type: integer, format: int64, description: "`shop_id` (nullable=false)" }
        userId: { type: integer, format: int64, description: "`user_id` (nullable=false)" }
        status: { $ref: "#/components/schemas/VisitStatus" }
        memo: { type: string, nullable: true, description: "TEXT 컬럼. 자유 입력." }
        visitedAt: { type: string, format: date, nullable: true, description: 방문일 (LocalDate) }

    SalesActivityCreate:
      type: object
      description: "[미구현] 영업 활동 기록 요청. 현재 엔터티 필드에 맞춘 최소 형태."
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/VisitStatus" }
        memo: { type: string, nullable: true }
        visitedAt: { type: string, format: date, nullable: true }

