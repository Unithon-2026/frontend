openapi: 3.0.3
info:
  title: MeetRoute API
  version: 0.3.0
  description: >
    축산물 영업인을 위한 지역별 음식점 잠재고객 데이터베이스 및 영업 우선순위 관리 서비스 API.


    **이 문서는 실제 백엔드(`unithon-2026/backend`, Spring Boot / `com.unithon.meetroute`)에 맞춰 갱신되었습니다.**
    구현 완료된 엔드포인트와 아직 서버가 없는 기획 단계 엔드포인트를 분리해서 표기합니다.


    - `x-backend-status: implemented` — 지금 호출 가능. 필드·파라미터는 서버 코드와 1:1로 맞춰져 있음.

    - `x-backend-status: planned` — Manyfast 기능명세서에서 도출한 초안. **서버에 아직 없음.**
      프론트에서 호출하면 404가 납니다. 설계 의도를 잃지 않도록 남겨두되, 구현 시 아래 공통 규약
      (ApiResponse 봉투 / Spring Page / ErrorCode)을 반드시 따를 것.


    ## 공통 규약


    ### 1. 응답 봉투

    모든 응답은 `ApiResponse<T>` 로 감싸집니다. 성공/실패 판정은 HTTP 상태코드가 아니라 `success` 필드로 합니다.

    ```json
    { "success": true,  "code": null,      "message": "OK", "data": { } }
    { "success": false, "code": "SHOP4001", "message": "해당 매장을 찾을 수 없습니다.", "data": null }
    ```


    ### 2. 페이지네이션

    목록은 Spring Data `Page` 를 그대로 직렬화합니다. **요청 `page` 는 0부터** 시작하고,
    정렬은 `sort=필드명,방향` 형식입니다(예: `sort=score,desc`). 응답은 `items/total` 이 아니라
    `content/totalElements/totalPages/number` 입니다.


    ### 3. 우선순위 등급

    서버 값은 **`S`/`A`/`B`/`C`** 입니다 (S가 최상위). 점수 구간은 S ≥ 80, A ≥ 60, B ≥ 40, 그 미만 C.


    프론트엔드는 이 값을 **화면에서만 1~4 등급으로 바꿔 표시**합니다
    (S→1등급, A→2등급, B→3등급, C→4등급). 요청 파라미터와 응답 파싱은 항상 서버 값 그대로입니다.
    백엔드를 고치지 않고 표기만 바꾸기 위한 프론트 전용 매핑입니다.


    아직 계산되지 않은 매장은 `score` 와 `priorityGrade` 가 모두 `null` 입니다.


    ### 4. 인증

    현재 백엔드 `SecurityConfig` 는 **전체 permitAll** 이라 토큰이 필요 없습니다.
    (해커톤용 임시 설정이며 auth 담당자가 교체 예정) 인증이 붙기 전까지 `/auth/*` 는 planned 입니다.

servers:
  - url: http://localhost:8080
    description: 로컬 백엔드 (Spring Boot 기본 포트, context-path 없음)

tags:
  - name: Shops
    description: 매장(잠재고객) 조회. **구현 완료.**
  - name: Auth
    description: 인증. 미구현 — 현재 서버는 전체 permitAll.
  - name: Regions
    description: 영업 구역. 미구현 — 현재는 `gu` 문자열을 직접 넘김.
  - name: Priority
    description: 우선순위 점수 조회·재계산. **구현 완료.**
  - name: Briefing
    description: AI 영업 브리핑. **구현 완료** (Spring AI + Anthropic).
  - name: Map
    description: 지도 영역 내 매장 조회. **구현 완료.**
  - name: Watchlist
    description: 관심 목록. 미구현.
  - name: Team
    description: 팀 현황. 미구현.
  - name: DataSources
    description: 수집 출처 관리. 미구현.
  - name: History
    description: 변경 이력. 미구현.
  - name: Admin
    description: 관리자 기능. 미구현.
  - name: SalesActivity
    description: AI CRM 후속 영업(영업 이력·AI 제안·데이터 라벨). 미구현 — 기획서 R-RABMND.

paths:
  # ================================================================
  # 구현 완료 — ShopController
  # ================================================================
  /api/v1/shops:
    get:
      tags: [Shops]
      x-backend-status: implemented
      x-backend-source: domain/shop/controller/ShopController.java#list
      summary: 매장 목록 조회 (페이지)
      description: >
        구/업종/우선순위등급으로 필터링한 매장 목록을 페이지 단위로 반환합니다.
        필터는 모두 선택이며 전달하지 않으면 전체 대상입니다.


        정렬 기본값은 `score,desc`(우선순위 높은 순)입니다. 단, 우선순위 계산 배치가 아직 돌지 않은
        매장은 `score` 가 null 이므로 목록에 null 점수 항목이 섞일 수 있습니다.


        필터는 모두 **정확히 일치(equals)** 로 동작합니다. 부분 검색·사업자명 검색은 미구현입니다.
      parameters:
        - name: gu
          in: query
          required: false
          schema: { type: string }
          example: 성동구
          description: 자치구명. DB에 저장된 값과 정확히 일치해야 합니다(부분 일치 아님).
        - name: businessType
          in: query
          required: false
          schema: { type: string }
          example: 한식
          description: >
            위생업태명. 서울시 공공데이터 원본 텍스트를 그대로 저장하므로 enum 이 아닌 자유 문자열이며,
            정확히 일치해야 합니다.
        - name: priorityGrade
          in: query
          required: false
          schema:
            type: string
            enum: [S, A, B, C]
          description: >
            우선순위 등급. 대소문자는 서버에서 무시합니다(`s` → `S`).
            S/A/B/C 외의 값이면 `COMMON400` 을 반환합니다.
            프론트 화면 표기는 1~4 등급이지만 **파라미터는 서버 값을 그대로** 보냅니다.
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
          description: "**0부터 시작**합니다. (기존 초안의 1-based 와 다름)"
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 페이지당 개수. 서버 기본값 20.
        - name: sort
          in: query
          required: false
          schema:
            type: array
            items: { type: string }
            default: ["score,desc"]
          style: form
          explode: true
          description: >
            `필드명,asc|desc` 형식. 여러 개면 `sort` 파라미터를 반복 전송합니다.
            정렬 가능한 필드는 Shop 엔터티 속성명(`score`, `name`, `gu`, `dong`, `businessType`, `area` 등).
      responses:
        "200":
          description: 성공. 조건에 맞는 매장이 없으면 `data.content` 가 빈 배열입니다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PageOfShopListItem" }
              example:
                success: true
                code: null
                message: OK
                data:
                  content:
                    - id: 1
                      name: 왕십리 화로구이
                      gu: 성동구
                      dong: 행당동
                      businessType: 식육(숯불구이)
                      score: 90
                      priorityGrade: S
                  totalElements: 1
                  totalPages: 1
                  number: 0
                  size: 20
                  numberOfElements: 1
                  first: true
                  last: true
                  empty: false
        "400":
          description: "`priorityGrade` 값이 S/A/B/C 가 아님"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
              example:
                success: false
                code: COMMON400
                message: "priorityGrade 값이 올바르지 않습니다: X"
                data: null
        "500": { $ref: "#/components/responses/InternalServerError" }

  /api/v1/shops/{shopId}:
    get:
      tags: [Shops]
      x-backend-status: implemented
      x-backend-source: domain/shop/controller/ShopController.java#getDetail
      summary: 매장 상세 조회
      parameters:
        - $ref: "#/components/parameters/ShopId"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ShopDetail" }
              example:
                success: true
                code: null
                message: OK
                data:
                  id: 1
                  name: 왕십리 화로구이
                  addressJibun: 서울특별시 성동구 행당동 128-3
                  gu: 성동구
                  dong: 행당동
                  phone: "02-2299-1234"
                  businessType: 한식
                  area: 158.4
                  longitude: 127.0378
                  latitude: 37.5612
                  score: 92
                  priorityGrade: S
        "404":
          description: 해당 id 의 매장 없음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
              example:
                success: false
                code: SHOP4001
                message: 해당 매장을 찾을 수 없습니다.
                data: null
        "500": { $ref: "#/components/responses/InternalServerError" }

  # ================================================================
  # 미구현 (planned) — 아래는 전부 서버에 없습니다. 호출하면 404.
  # Manyfast 기능명세서 기반 초안이며, 구현 시 위 공통 규약을 따를 것.
  # ================================================================
  /api/v1/auth/login:
    post:
      tags: [Auth]
      x-backend-status: planned
      summary: "[미구현] 로그인"
      description: >
        현재 백엔드 `SecurityConfig` 는 전체 permitAll 이며 로그인 엔드포인트가 없습니다.
        인증 도입 전까지 프론트는 토큰 없이 호출합니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
                          user: { $ref: "#/components/schemas/User" }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      x-backend-status: planned
      summary: "[미구현] 현재 사용자 정보 (역할·담당 구역 포함)"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }

  /api/v1/regions:
    get:
      tags: [Regions]
      x-backend-status: planned
      summary: "[미구현] 선택 가능한 시·군·구 및 담당 영업 구역 목록"
      description: >
        F-HNLXDA. 서버에 Region 엔터티가 없습니다. 현재 프론트는 자치구 목록을 하드코딩하고
        `GET /api/v1/shops?gu=` 에 구 이름 문자열을 그대로 넘깁니다.


        구현 시 주의: 백엔드 Shop 은 지역 **코드**가 아니라 `gu`/`dong` **문자열**을 들고 있으므로,
        Region.code(`11200`) 를 쓰려면 Shop 쪽에 코드 컬럼을 추가하거나 코드↔이름 매핑이 필요합니다.
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          assignedRegions:
                            type: array
                            items: { $ref: "#/components/schemas/Region" }
                          allRegions:
                            type: array
                            items: { $ref: "#/components/schemas/Region" }

  # ================================================================
  # 구현 완료 — PriorityController
  # ================================================================
  /api/v1/shops/{shopId}/priority:
    get:
      tags: [Priority]
      x-backend-status: implemented
      summary: 매장 우선순위 조회
      description: >
        이미 계산되어 저장된 매장의 우선순위 점수와 등급을 조회합니다.
        아직 계산된 값이 없으면 404 + `PRIORITY4001` 입니다.


        점수/등급 **값 자체는 목록·상세 응답의 `score`/`priorityGrade` 에도 들어 있습니다**
        (`Shop` 에 비정규화 캐싱). 이 엔드포인트는 `calculatedAt`(산정 시각)까지 필요할 때 씁니다.
      parameters:
        - $ref: "#/components/parameters/ShopId"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PriorityResponse" }
        "404":
          description: "매장 없음 `SHOP4001` / 아직 계산된 우선순위 없음 `PRIORITY4001`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    post:
      tags: [Priority]
      x-backend-status: implemented
      summary: 매장 우선순위 계산
      description: >
        해당 매장의 우선순위를 다시 계산해 저장하고 결과를 반환합니다.
        `Priority` 행이 없으면 새로 만들고, 있으면 갱신합니다.
        동시에 `Shop.score` / `Shop.priorityGrade` 캐시도 갱신됩니다.


        요청 본문은 없습니다. 산식은 `PriorityScoreCalculator` 참고 (업태 0~50 + 면적 0~30 + 연락처 0/20).
      parameters:
        - $ref: "#/components/parameters/ShopId"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PriorityResponse" }
        "404":
          description: "매장 없음 — `SHOP4001`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  # ================================================================
  # 구현 완료 — PriorityBatchController
  # ================================================================
  /api/v1/priorities/batch:
    post:
      tags: [Priority, Admin]
      x-backend-status: implemented
      summary: 전체 매장 우선순위 일괄 계산
      description: >
        등록된 모든 매장의 우선순위를 페이지 단위로 일괄 계산해 저장합니다.
        **매장 수가 많으면 응답까지 수 분이 걸릴 수 있습니다.** 요청 본문은 없습니다.


        현재 권한 체크가 없습니다(전체 permitAll). 역할이 도입되면 관리자 전용이 되어야 합니다.
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PriorityBatchResponse" }

  # ================================================================
  # 구현 완료 — ShopController (AI 브리핑)
  # ================================================================
  /api/v1/shops/{shopId}/briefing:
    post:
      tags: [Briefing]
      x-backend-status: implemented
      summary: AI 영업 브리핑 생성
      description: >
        매장의 인허가 데이터를 바탕으로 Anthropic API를 **1회 호출**해 영업 접근 방법을 요약한
        브리핑 텍스트를 생성합니다. 요청 본문은 없습니다.


        **GET이 아니라 POST 입니다** — 호출마다 외부 AI 비용이 발생하므로 캐시되지 않습니다.
        서버에 `ANTHROPIC_API_KEY` 가 없거나 호출이 실패하면 HTTP 502 + `SHOP5001`.
      parameters:
        - $ref: "#/components/parameters/ShopId"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/BriefingResponse" }
        "404":
          description: "매장 없음 — `SHOP4001`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "502":
          description: "AI 브리핑 생성 실패 — `SHOP5001`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /api/v1/admin/priority/recompute:
    post:
      tags: [Priority, Admin]
      x-backend-status: planned
      summary: "[미구현] 점수 재산정 요청 (관리자)"
      description: F-JZGEPZ trigger. 조직 관리자만. 서버에 역할(Role) 개념 자체가 아직 없습니다.
      responses:
        "202": { description: 재산정 작업 등록됨 }

  /api/v1/admin/industry-weights:
    get:
      tags: [Priority, Admin]
      x-backend-status: planned
      summary: "[미구현] 업종별 가중치 조회"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/IndustryWeight" }
    put:
      tags: [Priority, Admin]
      x-backend-status: planned
      summary: "[미구현] 업종별 가중치 수정 (조직 관리자만)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/IndustryWeight" }
      responses:
        "200": { description: 저장됨 }

  # ================================================================
  # 구현 완료 — ShopController (지도)
  # ================================================================
  /api/v1/shops/map:
    get:
      tags: [Map]
      x-backend-status: implemented
      summary: 지도 영역 내 매장 조회
      description: >
        F-LQMMWG / F-OFNSAT. 지도 화면에 보이는 영역(bounding box) 안의 매장을
        우선순위 점수 내림차순으로 최대 `limit` 개까지 조회합니다.


        프론트는 **카카오 지도 JavaScript SDK** 를 쓰며, 지도 이동·확대가 끝날 때(`idle`)
        `map.getBounds()` 의 남서/북동 좌표를 그대로 이 파라미터에 넣어 재조회합니다.
        남서 → `minLatitude`/`minLongitude`, 북동 → `maxLatitude`/`maxLongitude`.


        목록(`GET /api/v1/shops`)과 달리 **좌표를 포함한 마커 DTO**(`ShopMapMarkerResponse`)를 주고,
        `Page` 가 아니라 **평평한 배열**을 돌려줍니다.


        좌표가 `null` 인 매장은 bounding box 조건에서 자연히 빠지므로 응답에 포함되지 않습니다.
        "좌표 결측이라 지도에 못 그린 건" 목록이 필요하면 별도 엔드포인트가 있어야 합니다.
      parameters:
        - name: minLatitude
          in: query
          required: true
          description: 지도 영역 남쪽 경계 (카카오 `getBounds().getSouthWest().getLat()`)
          schema: { type: number, format: double, example: 37.41 }
        - name: maxLatitude
          in: query
          required: true
          description: 지도 영역 북쪽 경계
          schema: { type: number, format: double, example: 37.70 }
        - name: minLongitude
          in: query
          required: true
          description: 지도 영역 서쪽 경계
          schema: { type: number, format: double, example: 126.76 }
        - name: maxLongitude
          in: query
          required: true
          description: 지도 영역 동쪽 경계 (카카오 `getBounds().getNorthEast().getLng()`)
          schema: { type: number, format: double, example: 127.19 }
        - name: gu
          in: query
          description: 자치구 완전일치 필터
          schema: { type: string, example: 성동구 }
        - name: businessType
          in: query
          description: 위생업태명 완전일치 필터
          schema: { type: string, example: 한식 }
        - name: priorityGrade
          in: query
          description: 우선순위 등급 필터. 서버 값(S/A/B/C)을 보냅니다.
          schema: { $ref: "#/components/schemas/PriorityGrade" }
        - name: limit
          in: query
          description: 최대 마커 수. 미지정 시 500, 상한 1000.
          schema: { type: integer, default: 500, maximum: 1000 }
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ShopMapMarkerResponse" }
        "400":
          description: >
            `COMMON400` — bounding box 좌표 누락, `minLatitude > maxLatitude`,
            `minLongitude > maxLongitude`, 또는 `priorityGrade` 값 오류.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

