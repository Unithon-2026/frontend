components:
  parameters:
    ShopId:
      name: shopId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: 매장 PK. 백엔드가 `Long` 이므로 **숫자**입니다(기존 초안의 `L001` 문자열 아님).

  responses:
    InternalServerError:
      description: "서버 내부 오류 — `COMMON500`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  schemas:
    # ---------------------------------------------------------------- 공통 봉투
    ApiResponseEnvelope:
      type: object
      description: >
        global/response/ApiResponse.java. 모든 응답의 공통 껍데기.
        성공 시 `code` 는 null, 실패 시 `data` 는 null 입니다.
      required: [success, message]
      properties:
        success: { type: boolean }
        code:
          type: string
          nullable: true
          description: 실패 시에만 채워지는 에러 코드. 성공 시 null.
        message: { type: string, example: OK }

    ApiErrorResponse:
      type: object
      description: GlobalExceptionHandler 가 생성하는 실패 응답.
      properties:
        success: { type: boolean, enum: [false] }
        code:
          type: string
          enum: [COMMON400, COMMON404, COMMON500, SHOP4001, PRIORITY4001, SHOP5001]
          description: >
            global/exception/ErrorCode.java 와 1:1.

            `COMMON400` 잘못된 요청(400) /
            `COMMON404` 리소스 없음(404) /
            `COMMON500` 서버 오류(500) /
            `SHOP4001` 매장 없음(404) /
            `PRIORITY4001` 계산된 우선순위 없음(404) /
            `SHOP5001` AI 브리핑 실패(502)
        message: { type: string }
        data:
          nullable: true
          description: 실패 시 항상 null.

    # ---------------------------------------------------------------- 페이지
    SortInfo:
      type: object
      properties:
        sorted: { type: boolean }
        unsorted: { type: boolean }
        empty: { type: boolean }

    PageOfShopListItem:
      type: object
      description: >
        Spring Data `Page<ShopListItemResponse>` 직렬화 결과.
        기존 초안의 `items/page/pageSize/total` 과 필드명이 다르니 주의.
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/ShopListItem" }
        totalElements: { type: integer, description: 전체 건수 }
        totalPages: { type: integer }
        number: { type: integer, description: "현재 페이지 번호. **0부터 시작.**" }
        size: { type: integer, description: 페이지당 개수 }
        numberOfElements: { type: integer, description: 이번 페이지의 실제 건수 }
        first: { type: boolean }
        last: { type: boolean }
        empty: { type: boolean }
        sort: { $ref: "#/components/schemas/SortInfo" }
        pageable:
          type: object
          description: Spring 직렬화 모드에 따라 생략될 수 있으므로 의존하지 말 것.
          properties:
            pageNumber: { type: integer }
            pageSize: { type: integer }
            offset: { type: integer }
            paged: { type: boolean }
            unpaged: { type: boolean }
            sort: { $ref: "#/components/schemas/SortInfo" }

    # ---------------------------------------------------------------- Shop
    PriorityGrade:
      type: string
      enum: [S, A, B, C]
      nullable: true
      example: S
      description: >
        우선순위 등급. `domain/priority/entity/PriorityGrade.java`.


        | 서버 값 | 점수 구간 | 프론트 표기 |
        |---|---|---|
        | `S` | 80 이상 | 1등급 · 최우선 |
        | `A` | 60 이상 | 2등급 · 우선 |
        | `B` | 40 이상 | 3등급 · 검토 |
        | `C` | 40 미만 | 4등급 · 보류 |


        **통신 값은 항상 `S`/`A`/`B`/`C` 입니다.** 프론트엔드는 화면에만 1~4 등급으로 바꿔 표시하며
        (`WIRE_TO_GRADE` 매핑), 필터 파라미터에도 서버 값을 그대로 보냅니다.


        **우선순위 계산 전에는 `null`** 입니다 (`Shop.applyPriority()` 호출 전까지 `score` 와 함께 비어 있음).
        `POST /api/v1/shops/{shopId}/priority` 또는 `POST /api/v1/priorities/batch` 로 채웁니다.

    ShopListItem:
      type: object
      description: domain/shop/dto/ShopListItemResponse.java
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: 사업장명 }
        gu: { type: string, description: 자치구, example: 성동구 }
        dong: { type: string, description: 법정동, example: 행당동 }
        businessType:
          type: string
          description: >
            위생업태명. 서울시 공공데이터 원본 텍스트라 값의 종류를 사전에 알 수 없어
            백엔드도 enum 이 아닌 String 으로 저장합니다.
          example: 한식
        score:
          type: integer
          nullable: true
          description: 우선순위 점수. **미계산 시 null.**
        priorityGrade: { $ref: "#/components/schemas/PriorityGrade" }

    ShopDetail:
      type: object
      description: >
        domain/shop/dto/ShopDetailResponse.java.
        목록 항목에 주소·연락처·면적·좌표가 추가됩니다.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        addressJibun:
          type: string
          description: 지번 주소. 도로명 주소 컬럼은 백엔드에 없습니다.
        gu: { type: string }
        dong: { type: string }
        phone: { type: string, nullable: true }
        businessType: { type: string }
        area:
          type: number
          nullable: true
          description: >
            시설 면적(㎡). `BigDecimal` 이라 JSON number 로 내려옵니다.
            기존 초안의 `sizeEstimate`("중형 (48석)") 같은 문자열이 아니라 **숫자**이므로
            표시 문구는 프론트에서 구간을 나눠 만들어야 합니다.
        longitude: { type: number, nullable: true, description: 경도. null 이면 지도 미표시. }
        latitude: { type: number, nullable: true, description: 위도. null 이면 지도 미표시. }
        score: { type: integer, nullable: true }
        priorityGrade: { $ref: "#/components/schemas/PriorityGrade" }

    # ---------------------------------------------------------------- planned 전용 스키마
    User:
      type: object
      description: "[미구현] 서버에 User 엔터티 없음."
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [sales_rep, team_lead, org_admin]
          description: 영업 담당자 / 영업팀장 / 조직 관리자
        assignedRegions:
          type: array
          items: { $ref: "#/components/schemas/Region" }

    Region:
      type: object
      description: "[미구현] 서버는 지역 코드가 아니라 `gu`/`dong` 문자열을 사용합니다."
      properties:
        code: { type: string, example: "11200" }
        name: { type: string, example: 서울 성동구 }
        gu: { type: string, example: 성동구, description: "`GET /api/v1/shops?gu=` 에 넘길 값" }
        assigned: { type: boolean, description: 현재 사용자에게 배정된 구역인지 }

    PriorityResponse:
      type: object
      description: domain/priority/dto/PriorityResponse.java
      properties:
        shopId: { type: integer, format: int64, example: 1 }
        score:
          type: integer
          minimum: 0
          maximum: 100
          example: 90
          description: >
            업태 가중치(0~50) + 시설 면적(0~30) + 연락처 보유(0 또는 20).
            산식은 `PriorityScoreCalculator` 참고.
        grade: { $ref: "#/components/schemas/PriorityGrade" }
        calculatedAt:
          type: string
          format: date-time
          example: "2026-08-25T09:30:00"
          description: 산정 시각. `Priority.calculatedAt`.
      required: [shopId, score, grade]

    PriorityBatchResponse:
      type: object
      description: domain/priority/dto/PriorityBatchResponse.java
      properties:
        totalShopCount: { type: integer, format: int64, example: 2143, description: 대상 매장 총 건수 }
        processedCount: { type: integer, format: int64, example: 2143, description: 실제 계산·저장된 건수 }
        elapsedMillis: { type: integer, format: int64, example: 18432, description: 소요 시간(ms) }

    BriefingResponse:
      type: object
      description: domain/shop/briefing/dto/BriefingResponse.java
      properties:
        shopId: { type: integer, format: int64 }
        briefing:
          type: string
          description: AI가 생성한 영업 접근 브리핑 텍스트. 서식 없는 평문입니다.
          example: 왕십리 화로구이는 158㎡ 규모의 숯불구이 전문점으로 육류 소비량이 큽니다. 점심 피크를 피해 오후에 방문해 등심·삼겹 단가표를 제시하는 방법을 권합니다.

    ShopMapMarkerResponse:
      type: object
      description: domain/shop/dto/ShopMapMarkerResponse.java — 목록 DTO와 달리 좌표를 포함합니다.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: 왕십리 화로구이 }
        businessType: { type: string, nullable: true, example: 식육(숯불구이) }
        addressJibun: { type: string, nullable: true, example: 서울특별시 성동구 행당동 128-3 }
        phone: { type: string, nullable: true, example: 02-2299-1234 }
        latitude: { type: number, format: double, nullable: true, example: 37.5612 }
        longitude: { type: number, format: double, nullable: true, example: 127.0378 }
        score: { type: integer, nullable: true, example: 90 }
        priorityGrade: { $ref: "#/components/schemas/PriorityGrade" }

    IndustryWeight:
      type: object
      description: "[미구현] 점수 계산 입력. 값은 mock/industry-weights.json 참고."
      properties:
        businessType: { type: string, example: 한식 }
        weight: { type: integer, minimum: 0, maximum: 100, example: 96 }

    WatchlistEntry:
      type: object
      description: "[미구현] 서버에 엔터티·사용자 개념 모두 없음."
      properties:
        entryId: { type: string }
        userId: { type: string }
        shopId: { type: integer, format: int64 }
        shop: { $ref: "#/components/schemas/ShopListItem" }
        salesStatus:
          type: string
          enum: [to_contact, visited, proposed, on_hold]
        memo: { type: string, maxLength: 1000 }
        savedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TeamRow:
      type: object
      description: "[미구현]"
      properties:
        memberId: { type: string }
        memberName: { type: string }
        shopId: { type: integer, format: int64 }
        businessName: { type: string }
        businessType: { type: string }
        priorityGrade: { $ref: "#/components/schemas/PriorityGrade" }
        salesStatus:
          type: string
          enum: [to_contact, visited, proposed, on_hold]
        updatedAt: { type: string, format: date }
        duplicate:
          type: boolean
          description: 동일 매장을 2인 이상 저장 시 true

    DataSource:
      type: object
      description: "[미구현]"
      properties:
        id: { type: string }
        name: { type: string }
        provisionType: { type: string, example: 공공 OpenAPI }
        schedule: { type: string, example: 매일 06:00 }
        active: { type: boolean }
        lastCollectedAt: { type: string, format: date-time }
        lastStatus:
          type: string
          enum: [success, partial_failure, failure]

    DataSourceInput:
      type: object
      description: "[미구현]"
      required: [name, provisionType, schedule]
      properties:
        name: { type: string }
        provisionType: { type: string }
        schedule: { type: string }
        active: { type: boolean, default: true }

    DedupCandidate:
      type: object
      description: "[미구현]"
      properties:
